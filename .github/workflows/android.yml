name: Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.38.5"
  CORE_VERSION: "4.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Go-ядро не собираем: берём готовый артефакт из релизов hiddify-core
      - name: Ядро hiddify-core
        run: |
          mkdir -p android/app/libs
          curl -fL "https://github.com/hiddify/hiddify-core/releases/download/v${CORE_VERSION}/hiddify-lib-android.tar.gz" \
            | tar xz -C android/app/libs
          ls -lh android/app/libs

      - name: Зависимости и генерация
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      # Ключ подписи хранится в секретах репозитория, в коде его нет.
      # Без секретов сборка идёт с отладочной подписью — ставится, но обновлять поверх релизной нельзя.
      - name: Ключ подписи
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > android/key.jks
          {
            echo "storeFile=$(pwd)/android/key.jks"
            echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}"
          } > android/key.properties

      - name: Сборка APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: most-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
